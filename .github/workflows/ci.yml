name: CI / CD

on:
  push:
    branches: ["main", "note_taker"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: pytest backend/tests -v --tb=short
        env:
          NOTES_DB_URL: sqlite+aiosqlite:///:memory:
          AI_PROVIDER: "null"
          AI_CLASSIFIER_ENABLED: "false"

  # ── Frontend tests ───────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker build (validation on PRs and note_taker branch) ───────────────────
  docker-build:
    name: Docker build (dry-run)
    runs-on: ubuntu-latest
    needs: [test, test-frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/note_taker'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: note-taker-backend:ci

  # ── Docker build + push to Docker Hub (main branch only) ────────────────────
  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/note-taker-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/note-taker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

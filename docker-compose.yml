services:
  backend:
    image: ${DOCKERHUB_BACKEND_IMAGE:-anxdeveloper/note-taker-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"           # reachable within the docker network; not published to the host
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${DOCKERHUB_FRONTEND_IMAGE:-anxdeveloper/note-taker-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
